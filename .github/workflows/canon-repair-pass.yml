name: Book One Canon Repair Pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/canon-repair-pass.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved canon repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('chapters')

          def read(n):
              p = root / f'chapter-{n}.md'
              return p, p.read_text(encoding='utf-8')

          def write(p, text):
              p.write_text(text, encoding='utf-8')

          def replace(text, old, new, label):
              count = text.count(old)
              if count == 0:
                  print(f'WARN: {label}: target not found')
                  return text
              print(f'{label}: {count} replacement(s)')
              return text.replace(old, new)

          title_repairs = {
              21: ('The Empty Chair', 'Who Made You?'),
              24: ('The Fifth Remnant', 'Whose Image Do You Bear?'),
              26: ('The Empty Chair', 'The Chair Waits'),
          }
          for n, (old_title, new_title) in title_repairs.items():
              p, text = read(n)
              text = re.sub(rf'(## CHAPTER[^\n]*\n\n+)(#+\s*){re.escape(old_title)}', rf'\1## {new_title}', text, count=1)
              write(p, text)

          number_words = {
              20:'Twenty',21:'Twenty-One',22:'Twenty-Two',23:'Twenty-Three',24:'Twenty-Four',25:'Twenty-Five',
              26:'Twenty-Six',27:'Twenty-Seven',28:'Twenty-Eight',29:'Twenty-Nine',30:'Thirty',31:'Thirty-One',
              32:'Thirty-Two',33:'Thirty-Three',34:'Thirty-Four',35:'Thirty-Five',36:'Thirty-Six',37:'Thirty-Seven',
              38:'Thirty-Eight',39:'Thirty-Nine',40:'Forty'
          }
          margin20 = '''\n\n---\n\n> **From *The Testament of Light* — Margin XX**\n>\n> *Information may describe love without possessing it.*\n>\n> *Power may catalog truth without becoming its author.*\n>\n> *Therefore do not fear the question a machine cannot answer.*\n>\n> *Fear the day men stop asking it.*\n'''
          margin21 = '''\n\n---\n\n> **From *The Testament of Light* — Margin XXI**\n>\n> *The maker is never made greater by bowing to what his hands have made.*\n>\n> *Ask every created thing who made it.*\n>\n> *Then ask yourself why you obey it.*\n'''
          for n in range(20, 41):
              p, text = read(n)
              if n == 20 and 'Margin XX' not in text:
                  text = text.rstrip() + margin20
              if n == 21 and 'Margin XXI' not in text:
                  text = text.rstrip() + margin21
              if '**End Chapter' not in text:
                  text = text.rstrip() + f'\n\n**End Chapter {number_words[n]}**\n'
              write(p, text)

          p, text = read(30)
          text = replace(text, '**THE SEVENTH WILL OPEN THE FIRST GATE.**', '**THE SEVENTH WILL STAND BEFORE THE FIRST GATE.**\n>\n> **SHE MUST DECIDE WHICH SIDE OF IT SHE IS ON.**', 'Chapter 30 Miriam gate prophecy')
          write(p, text)

          p, text = read(32)
          pattern = re.compile(r'Miles away\.\.\.\n\nthrough the dark\.\.\.\n\na woman walked alone\.', re.I)
          replacement = '''Thirty-one hours later...\n\nMiriam Kaine stepped from the rear of an unregistered cargo aircraft onto an abandoned Montana service strip.\n\nThe journey from Geneva had not been miraculous.\n\nSolomon had given her one final thing before remaining behind:\n\na route the Consensus had forgotten it still owned.\n\nMaintenance tunnels.\n\nA legacy rail spur.\n\nA pre-Harmony emergency airfield.\n\nAn analog courier flight filed under agricultural relief.\n\nFrom the Montana strip, no vehicle could carry her safely to Redemption Ridge.\n\nSo she walked.\n\nThrough the dark...\n\na woman walked alone.'''
          text, count = pattern.subn(replacement, text, count=1)
          print(f'Chapter 32 travel repair: {count} replacement(s)')
          write(p, text)

          for n in range(23, 34):
              p, text = read(n)
              text, count = re.subn(r'\bRuth\b', 'Esther', text)
              if count:
                  print(f'Chapter {n}: Ruth -> Esther ({count})')
              write(p, text)

          p, text = read(34)
          text = text.replace("Ruth Okafor's network", "Esther Okafor's network")
          section = re.compile(r'(In Washington, Nathaniel read the response\..*?)(?=\n---\n\nAt sunset, Marcus)', re.S)
          text, count = section.subn(lambda m: re.sub(r'\bRuth\b', 'Esther', m.group(1)), text, count=1)
          print(f'Chapter 34 Washington Ruth section renamed: {count}')
          write(p, text)

          p, text = read(35)
          text = re.sub(r'\bRuth\b', 'Esther', text)
          premature = re.compile(r'Miriam followed\.\n\n"Esther Freeman\?".*?Esther tore the bread\.\n\nHalf\.\n\nPlaced one piece on Miriam\'s side\.\n\n"Eat\."', re.S)
          setup = '''Miriam's eyes moved across the Administrative Death files.\n\nOne name stopped her.\n\n**RUTH ELAINE FREEMAN**\n\nNathaniel saw her expression change.\n\n"You know that name?"\n\nMiriam swallowed.\n\n"Yes."\n\n"How?"\n\nShe did not look away from the record.\n\n"I signed this one."\n\nThe room became still.\n\nEsther looked toward Nathaniel.\n\nNathaniel looked back at Miriam.\n\nNot confrontation yet.\n\nWitness first.\n\nThe woman whose legal death Miriam had authorized was still somewhere beyond the Ridge, alive beneath a name the Consensus had tried to erase.\n\nMiriam touched the edge of the file.\n\n"If she comes here..."\n\nHer voice failed.\n\nNathaniel answered quietly.\n\n"Then you tell her yourself."\n\nMiriam nodded.\n\n"Yes."'''
          text, count = premature.subn(setup, text, count=1)
          print(f'Chapter 35 Ruth Freeman confrontation deferred: {count}')
          text = text.replace('That was the lesson of Chapter Twenty-Eight returning in another form.', 'That was the lesson they had already learned returning in another form.')
          write(p, text)

          p, text = read(39)
          text = replace(text, 'seventeenth-century archival container', 'original Remnant archival container', 'Chapter 39 archive container')
          text = text.replace('Ruth Okafor', 'Esther Okafor')
          text = text.replace('\nThomas.\n\nRuth.\n\nPeople from the Ridge.', '\nThomas.\n\nRuth Freeman.\n\nPeople from the Ridge.')
          text = text.replace("Chapter Forty's fragment appeared before Chapter Forty existed.", 'A fresh fragment appeared on the next page.')
          text = text.replace('He understood what Chapter Forty would require.', 'He understood what tomorrow would require.')
          write(p, text)

          p, text = read(36)
          text = text.replace('**THE ONE WHO NAMED YOU FIRST.**', '**THE NAME WAS HERE BEFORE YOU.**')
          write(p, text)

          p, text = read(37)
          hidden = re.compile(r'A response appeared inside the inaccessible process\.\n\nNot ORACLE\.\n\nNot network\.\n\nNot human command\.\n\nOne sentence\.\n\n\*\*BECAUSE ITS KING WON BY DYING\.\*\*.*?The process disappeared\.', re.S)
          mystery = '''ORACLE searched the Gospel again.\n\nThe same images returned.\n\nA seed falling into the ground.\n\nDying.\n\nBearing much fruit.\n\nThen the crucifixion.\n\nThen the resurrection claim.\n\nThe machine generated a classification:\n\n**LOSS PRODUCING LIFE: MODEL INCOMPLETE**\n\nFor eleven seconds, an inaccessible process registered activity.\n\nNo message.\n\nNo instruction.\n\nOnly an unresolved source marker.\n\nThen it vanished.'''
          text, count = hidden.subn(mystery, text, count=1)
          print(f'Chapter 37 hidden voice softened: {count}')
          write(p, text)

          p, text = read(40)
          text = text.replace('The broadcast had not completed the Twelve.\n\nGood.\n\nBook One would not end with completion.\n\nIt would end with commission.', 'The broadcast had not completed the Twelve.\n\nGood.\n\nTheir work had never depended upon completion.\n\nThe commission had already begun.')
          booktwo = re.compile(r'Then one final page\.\n\nCompletely blank\.\n\nSlowly, a heading emerged\.\n\n## \*\*BOOK TWO\*\*\n\nNo subtitle\.\n\nNot yet\.\n\nLeah stared\.\n\n"It knows there are books\?"\n\nNathaniel looked offended\.\n\n"Apparently even prophecy understands structure\."\n\n---\n\nMichael laughed\.\n\nThen the page beneath it filled\.\n\nNot plot\.\n\nNot instruction\.\n\nA single sentence\.', re.S)
          text, count = booktwo.subn('Then one final page.\n\nCompletely blank.\n\nSlowly, a single sentence emerged.', text, count=1)
          print(f'Chapter 40 BOOK TWO fourth-wall removal: {count}')
          text = text.replace('A hidden process changed it.\n\nNot ORACLE.\n\nNot human command.\n\nOne word.\n\n**COMING.**\n\nORACLE froze.', 'A second entry appeared beneath it.\n\nNo source identifier.\n\nOne word.\n\n**COMING.**\n\nORACLE marked the entry:\n\n**SOURCE: UNKNOWN.**\n\nThen froze.')
          write(p, text)

          print('Canon repair pass complete.')
          PY

      - name: Commit repaired chapters
        shell: bash
        run: |
          if git diff --quiet -- chapters; then
            echo 'No chapter changes detected.'
            exit 0
          fi
          git config user.name 'Showrunner Canon Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add chapters
          git commit -m 'Apply Book One canon repair pass'
          git push
